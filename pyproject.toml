[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-inspect"
version = "0.1.0"
description = "Explainable reference-based visual defect inspection with synthetic evaluation"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
vision-inspect = "visioninspect.cli:main"

[tool.setuptools.packages.find]
include = ["visioninspect*"]
